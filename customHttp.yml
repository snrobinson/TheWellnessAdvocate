# AWS Amplify custom HTTP security headers (applied by Amplify Hosting at the edge —
# no build step required). Docs: https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#
# NOTE: the Content-Security-Policy below allows Google Fonts (the site's one
# external resource) and nothing else. If a third-party script or embed is ever
# added to the site, this policy must be updated or the browser will block it.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      # PREVIEW-ONLY: keeps every file (pages, images, README) out of search until
      # launch. Delete these two lines at launch (README, "Preview: hidden from search").
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
